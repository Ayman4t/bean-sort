<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bean Sort</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--felt:#4a4d55;--ink:#f1ece4;--bar:#2b2d33;--red:#a4262c;--blk:#15151a;--acc:#e8b04a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--felt);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--bar);flex-wrap:wrap}
h1{font-size:1.25rem;font-weight:800;margin:0;margin-inline-end:auto}
.stat{font-size:.95rem;min-width:70px}
.stat b{font-weight:800;font-size:1.15rem;color:var(--acc)}
button{font:inherit;font-weight:800;background:var(--acc);color:#241a05;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#bar{height:6px;background:#0003;display:flex}
#bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
#tools{display:flex;gap:8px;padding:8px 14px;background:var(--bar);border-top:1px solid #0004;overflow-x:auto;align-items:center;white-space:nowrap}
#tools span{font-size:.8rem;opacity:.7}
#tools span:nth-of-type(2){margin-inline-start:10px}
#tools button{padding:6px 12px;font-size:.85rem;flex:none}
#tools .h{background:#7fc47f;color:#10260f}
#tools .x{background:#e1654f;color:#2a0903}
main{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:none}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:.9rem;opacity:.8;pointer-events:none}
#win{position:absolute;inset:0;display:none;place-items:center;background:#000a;text-align:center}
#win.on{display:grid}
#win div{background:var(--bar);padding:28px 34px;border-radius:18px;max-width:320px}
#win h2{margin:0 0 8px;font-size:1.8rem}
#win p{margin:0 0 16px}
</style>
</head>
<body>
<header>
  <h1>Bean Sort</h1>
  <span class="stat">Sorted <b id="pct">0%</b></span>
  <span class="stat">Time <b id="time">0:00</b></span>
  <button id="again">Shuffle</button>
</header>
<div id="bar"><i id="fill"></i></div>
<div id="tools"><span>Helpers (+8s)</span><button class="h" data-t="magnet">🧲 Magnet</button><button class="h" data-t="big">🥢 Big chopstick</button><button class="h" data-t="fix">✨ Fix 20</button><span>Troublemakers (−5s)</span><button class="x" data-t="wind">💨 Gust</button><button class="x" data-t="quake">🌋 Quake</button><button class="x" data-t="more">➕ 20 beans</button></div>
<main>
  <canvas id="c"></canvas>
  <div class="hint">Push every bean to its side: red left, black right. You win only at a perfect 100%.</div>
  <div id="win"><div><h2>All sorted!</h2><p id="wmsg"></p><button id="again2">Play again</button></div></div>
</main>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,dpr,beans=[],N=340,t0=0,done=false,R=46,allOk=false,adj=0,fx={magnet:0,big:0,quake:0},mouse={x:-99,y:-99,px:-99,py:-99,down:false};
var $=function(i){return document.getElementById(i)};

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
function init(){
  resize();
  var area=W*H,r=Math.max(6,Math.min(11,Math.sqrt(area/N/4.2)));
  beans=[];
  for(var i=0;i<N;i++){
    beans.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,a:Math.random()*6.28,
      red:i%2===0,r:r,s:Math.random()*.15+.92});
  }
  t0=performance.now();done=false;adj=0;fx.magnet=fx.big=fx.quake=0;$('win').classList.remove('on');
}
function pos(e){var b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);var p=pos(e);mouse.x=mouse.px=p.x;mouse.y=mouse.py=p.y;mouse.down=true});
cv.addEventListener('pointermove',function(e){var p=pos(e);mouse.px=mouse.x;mouse.py=mouse.y;mouse.x=p.x;mouse.y=p.y});
cv.addEventListener('pointerup',function(){mouse.down=false});
cv.addEventListener('pointercancel',function(){mouse.down=false});
window.addEventListener('resize',function(){var ow=W,oh=H;resize();beans.forEach(function(b){b.x*=W/ow;b.y*=H/oh})});

function step(){
  var i,j,a,b,dx,dy,d,m,n;
  R=fx.big>0?90:46;
  if(fx.big>0)fx.big--;
  if(fx.magnet>0){fx.magnet--;for(i=0;i<beans.length;i++)beans[i].vx+=(beans[i].red?-.45:.45)}
  if(fx.quake>0){fx.quake--;for(i=0;i<beans.length;i++){beans[i].vx+=(Math.random()-.5)*4;beans[i].vy+=(Math.random()-.5)*4}}
  if(mouse.down){
    var vx=mouse.x-mouse.px,vy=mouse.y-mouse.py;
    for(i=0;i<beans.length;i++){
      a=beans[i];dx=a.x-mouse.x;dy=a.y-mouse.y;d=Math.sqrt(dx*dx+dy*dy);
      if(d<R){var f=(1-d/R);a.vx+=vx*f*.5+(dx/(d||1))*f*1.2;a.vy+=vy*f*.5+(dy/(d||1))*f*1.2}
    }
    mouse.px=mouse.x;mouse.py=mouse.y;
  }
  for(i=0;i<beans.length;i++){
    a=beans[i];
    for(j=i+1;j<beans.length;j++){
      b=beans[j];dx=b.x-a.x;dy=b.y-a.y;m=a.r+b.r;
      if(dx>m||dx<-m||dy>m||dy<-m)continue;
      d=Math.sqrt(dx*dx+dy*dy);
      if(d<m&&d>0){
        n=(m-d)/2;dx/=d;dy/=d;
        a.x-=dx*n;a.y-=dy*n;b.x+=dx*n;b.y+=dy*n;
        var rel=(b.vx-a.vx)*dx+(b.vy-a.vy)*dy;
        if(rel<0){a.vx+=dx*rel*.4;a.vy+=dy*rel*.4;b.vx-=dx*rel*.4;b.vy-=dy*rel*.4}
      }
    }
  }
  for(i=0;i<beans.length;i++){
    a=beans[i];
    a.x+=a.vx;a.y+=a.vy;a.vx*=.88;a.vy*=.88;
    a.a+=(a.vx-a.vy)*.03;
    if(a.x<a.r){a.x=a.r;a.vx*=-.3}
    if(a.x>W-a.r){a.x=W-a.r;a.vx*=-.3}
    if(a.y<a.r){a.y=a.r;a.vy*=-.3}
    if(a.y>H-a.r){a.y=H-a.r;a.vy*=-.3}
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.strokeStyle='#ffffff22';ctx.setLineDash([8,10]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.restore();
  for(var i=0;i<beans.length;i++){
    var b=beans[i];
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);
    ctx.fillStyle=b.red?'#a4262c':'#15151a';
    ctx.beginPath();ctx.ellipse(0,0,b.r*1.05,b.r*.72*b.s,0,0,6.283);ctx.fill();
    ctx.fillStyle=b.red?'#ffffff40':'#ffffff22';
    ctx.beginPath();ctx.ellipse(-b.r*.25,-b.r*.25,b.r*.4,b.r*.18,0,0,6.283);ctx.fill();
    if(b.red){ctx.strokeStyle='#f3d9c8';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-b.r*.5,b.r*.45);ctx.lineTo(b.r*.5,b.r*.45);ctx.stroke()}
    ctx.restore();
  }
  if(mouse.x>-50){
    ctx.save();ctx.translate(mouse.x,mouse.y);ctx.rotate(-.5);
    ctx.fillStyle=mouse.down?'#e0a45a':'#d9a566';
    ctx.fillRect(-4,-4,150,8);ctx.restore();
    ctx.strokeStyle='#ffffff55';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(mouse.x,mouse.y,R,0,6.283);ctx.stroke();
  }
}
function score(){
  var ok=0;
  for(var i=0;i<beans.length;i++){var b=beans[i];if((b.x<W/2)===b.red)ok++}
  allOk=(ok===beans.length);var p=Math.floor(ok/beans.length*100);
  $('pct').textContent=p+'%';$('fill').style.width=p+'%';
  return p;
}
function fmt(s){return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2)}
var tick=0;
function loop(){
  step();draw();
  if(!done&&++tick%6===0){
    var el=Math.max(0,(performance.now()-t0)/1000+adj);$('time').textContent=fmt(el);
    var p=score();
    if(allOk){done=true;$('wmsg').textContent='Perfect 100% in '+fmt(el)+'.';$('win').classList.add('on')}
  }
  requestAnimationFrame(loop);
}
var tools={
magnet:function(){fx.magnet=300;adj+=8},
big:function(){fx.big=600;adj+=8},
fix:function(){var c=0;beans.forEach(function(b){if(c<20&&(b.x<W/2)!==b.red){b.vx+=(b.red?-1:1)*16;b.vy+=(Math.random()-.5)*4;c++}});adj+=8},
wind:function(){var s=Math.random()<.5?-1:1;beans.forEach(function(b){b.vx+=s*(10+Math.random()*6);b.vy+=(Math.random()-.5)*6});adj-=5},
quake:function(){fx.quake=120;adj-=5},
more:function(){for(var i=0;i<20;i++)beans.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,a:Math.random()*6.28,red:i%2===0,r:beans[0].r,s:1});adj-=5}
};
Array.prototype.forEach.call(document.querySelectorAll('#tools button'),function(bt){bt.onclick=function(){if(!done)tools[bt.dataset.t]()}});
$('again').onclick=$('again2').onclick=init;
init();loop();
})();
</script>
</body>
</html>
